<!-- Micro-interaction Script for atmospheric depth -->
<script>
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.glass-panel');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            const moveX = (x - 0.5) * 10;
            const moveY = (y - 0.5) * 10;
            
            card.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });

        // Simple form validation visual feedback
        const input = document.getElementById('email');
        const form = document.querySelector('form');
        
        form.addEventListener('submit', () => {
            if (input.value) {
                const btn = form.querySelector('button');
                btn.innerHTML = `
                    <span class="uppercase tracking-widest">Enviando...</span>
                    <span class="material-symbols-outlined animate-spin">progress_activity</span>
                `;
                btn.classList.replace('bg-primary', 'bg-surface-container-highest');
                btn.classList.add('pointer-events-none');
            }
        });
    </script>
